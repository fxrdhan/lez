#
# Publishes a release when a v* tag is pushed.
#
# The binaries are built on GitHub runners, one target per runner, natively.
# The justfile's `cross` recipe builds seven targets through Docker instead;
# that path needs a working `--no-default-features` build, which the tree does
# not currently have, and it runs containers on the maintainer's machine. This
# does neither.
#
# The release is published as soon as every binary is built. Its notes are
# the version's section of CHANGELOG.md, the one written by hand: the commit
# titles git-cliff would list say little once a pull request is squashed.
#
# Run any other way, by hand or by a pull request that changes this file, it
# is a dry run: everything is built and packaged, under a stand-in version,
# and nothing is published. Run it by hand on the release branch before
# tagging, since the packaging steps run nowhere else.
name: Release
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main, dev]
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  # The pushed tag; on a dry run, a stand-in that is safe in a file name and
  # in the sed below, unlike a pull request's ref name, `150/merge`.
  VERSION: ${{ github.event_name == 'push' && github.ref_name || 'v0.0.0-dry-run' }}
jobs:
  binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Add target to active toolchain
        run: rustup target add ${{ matrix.target }}
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --features git,inspect-archives
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          tar czf "dist/lez_${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" lez
      - name: Package (.deb)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
          for page in lez.1 lez_colors.5 lez_colors-explanation.5; do
            sed "s/\$version/${VERSION}/g" "man/${page}.md" \
              | pandoc --standalone -f markdown -t man > "man/${page}"
          done
          cargo install cargo-deb --locked
          cargo deb --no-build --target ${{ matrix.target }} -o dist/
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/lez.exe" -DestinationPath "dist/lez_${{ matrix.target }}.zip"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Take the version's section of CHANGELOG.md
        id: notes
        run: |
          # The first `version =` in Cargo.toml is the package's.
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ "${VERSION}" != "v${version}" ]; then
            echo "::error file=Cargo.toml::The tag is ${VERSION}, but Cargo.toml says ${version}."
            exit 1
          fi
          awk -v head="## [${version}]" '
            index($0, "## [") == 1 { if (on) exit; on = index($0, head) == 1; next }
            on
          ' CHANGELOG.md > NOTES.md
          if ! grep -q '[^[:space:]]' NOTES.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no section for ${version}."
            exit 1
          fi
          cat NOTES.md
          {
            echo "notes<<EOF_NOTES"
            cat NOTES.md
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"
  docs:
    name: Man pages and completions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pandoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
      - name: Build the tarballs
        run: |
          version="${VERSION}"
          mkdir -p "man-${version}" "completions-${version}" dist
          for page in lez.1 lez_colors.5 lez_colors-explanation.5; do
            sed "s/\$version/${version}/g" "man/${page}.md" \
              | pandoc --standalone -f markdown -t man > "man-${version}/${page}"
          done
          cp completions/*/* "completions-${version}/"
          tar czf "dist/man-${version}.tar.gz" "man-${version}"
          tar czf "dist/completions-${version}.tar.gz" "completions-${version}"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: dist/*
          if-no-files-found: error
  publish:
    name: Publish the release
    needs: [binaries, docs, notes]
    # Only a pushed tag publishes; run by hand, even on a tag, it is a dry run.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Collect the artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          ls -l dist
      - name: Write the release notes
        env:
          NOTES: ${{ needs.notes.outputs.notes }}
        run: |
          printf '%s\n' "${NOTES}" > NOTES.md
          {
            echo
            echo "## Checksums"
            echo
            echo '```'
            (cd dist && sha256sum ./*)
            echo '```'
          } >> NOTES.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "lez ${GITHUB_REF_NAME}" \
            --notes-file NOTES.md \
            dist/*
  homebrew:
    name: Update the Homebrew formula
    needs: publish
    # Its own job, so a tap token that cannot write fails here alone rather
    # than marking the release, or anything waiting on it, failed.
    if: "!contains(github.ref_name, '-')"
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 # v4.2
        if: env.COMMITTER_TOKEN != ''
        with:
          formula-name: lez
          homebrew-tap: fxrdhan/homebrew-tap
          base-branch: main
          download-url: https://github.com/fxrdhan/lez/archive/refs/tags/${{ github.ref_name }}.tar.gz
          commit-message: "bump lez to ${{ github.ref_name }}"
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
