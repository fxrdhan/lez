name: Nix Cold Build Canary
# Weekly sanity check that the flake still builds from a cold Nix store.
# Guards against cache-only breakage (missing vendored inputs, sandbox
# issues) that Cachix hits in the regular CI pipeline would otherwise mask.
#
# Only cache.nixos.org is allowed to substitute, so every lez derivation is
# built here while nixpkgs' own toolchain is not. Disabling substitution
# outright rebuilt all of nixpkgs from source for hours and failed on
# upstream source URLs that have since gone dead, never reaching lez.
on:
  schedule:
    # Mondays 05:00 UTC — after the Thursday dependency-update PR has settled
    - cron: "0 5 * * 1"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  cold-build:
    name: Cold build without project cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # Sandboxed, as in CI: the generated trycmd suites pass only as the
      # `nixbld` user the sandbox presents. And, as there, without
      # /etc/ssl/certs among the sandbox paths, which breaks every crate
      # download: see the Nix job in ci.yml.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            sandbox = true
            ssl-cert-file = /etc/ssl/certs/ca-certificates.crt
            user-agent = lez-ci (https://github.com/fxrdhan/lez)
      - name: Configure curl user-agent for crates.io
        run: |
          echo 'user-agent = "lez-ci (https://github.com/fxrdhan/lez)"' >> ~/.curlrc
          sudo sh -c 'echo "user-agent = \"lez-ci (https://github.com/fxrdhan/lez)\"" >> /etc/curlrc' 2>/dev/null || true
      - name: Nix Flake Check (cache.nixos.org only)
        run: nix flake check -L --option substituters https://cache.nixos.org
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIX_SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
