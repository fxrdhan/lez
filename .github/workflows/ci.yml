name: CI
# No paths-ignore for Markdown: the suite reads README.md and the man pages,
# and REUSE checks every file, so a change to them alone has to run too. The
# changes job below decides which jobs a pull request needs.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings
  # rust-toolchain.toml pins the MSRV for every cargo command in the
  # checkout, and left to itself rustup installs it with every component it
  # lists, an auto-install rustup has deprecated. So each job installs the
  # toolchain it needs and names it in RUSTUP_TOOLCHAIN, which outranks that
  # file: the MSRV where it checks the code, stable where it builds what
  # ships.
  MSRV: "1.90"
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    # paths-filter lists a pull request's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Classify changed files
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
              # The suite asserts on these from disk (man_docs_tests,
              # zsh_completion_classify_tests, theme_schema_tests), so a
              # change to one of them has to run the tests that guard it.
              - 'man/**'
              - 'completions/**'
              - 'docs/**'
              - 'justfile'
              - 'README.md'
              # powertest_config reads powertest.yaml and
              # devtools/generate-trycmd-test.sh from disk too, and the
              # coverage job runs devtools/coverage.sh.
              - 'powertest.yaml'
              - 'devtools/**'
              # The lint job checks that the fuzz targets compile.
              - 'fuzz/**'
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - 'Cargo.lock'
              # The flake builds the crate and runs the trycmd suites under
              # tests/gen and tests/ptests, which no other job runs. Anything
              # that can change what it builds or what those snapshots expect
              # has to trigger it, or a pull request goes green and main goes
              # red on the very next push.
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'man/**'
              - 'completions/**'
              - 'justfile'
              - '.config/**'
              # The generated suites run against fixtures these scripts make.
              - 'devtools/**'
              - '.github/workflows/ci.yml'
              # The flake's formatting check runs yamlfmt, taplo and
              # shellcheck over the whole tree, so any file of theirs counts:
              # the other workflows, deny.toml, packaging scripts and the like.
              - '**/*.yml'
              - '**/*.yaml'
              - '**/*.toml'
              - '**/*.sh'
  lint-and-format:
    name: Lint & Format (Rustfmt, Clippy & features)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.MSRV }}
          components: clippy, rustfmt
      - name: Use the MSRV toolchain
        run: echo "RUSTUP_TOOLCHAIN=$MSRV" >> "$GITHUB_ENV"
      # Every Rust cache is saved from dev alone. A pull request restores
      # dev's, and one it saved under its own merge ref would serve that pull
      # request only, while pushing dev's out of the repository's 10 GB.
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --features git,inspect-archives -- -D warnings
      # The fuzz targets are a crate of their own, outside the workspace, so
      # nothing above compiles them, and the Fuzz Canary runs only on pull
      # requests and pushes to main and dev. A change to an API they call
      # would show only there, after everything else had gone green. With
      # the workspace's lockfile and target directory they build against
      # the same versions, reusing what Clippy built.
      # Not `--locked`: the copied lockfile lacks the fuzz crate and
      # libfuzzer-sys, which cargo adds to it.
      - name: Check fuzz targets
        run: |
          cp Cargo.lock fuzz/Cargo.lock
          cargo check --manifest-path fuzz/Cargo.toml --bins --target-dir target
      # Clippy above has checked both features on, which is the default set;
      # these switch them off. The tests too: a suite that builds its Git or
      # tar fixtures with an optional crate is gated on that crate's feature,
      # and a packager who switches a feature off still runs the rest. Each
      # check takes seconds, less than a job of its own took to set up.
      #
      # RUSTFLAGS carries --deny warnings from the workflow env, so an item
      # left behind by a switched-off feature fails here rather than rotting.
      - name: Check feature combinations
        run: |
          status=0
          for features in "" git inspect-archives; do
            echo "::group::--no-default-features --features '${features}'"
            if ! cargo check --locked --all-targets --no-default-features --features "$features"; then
              echo "::error::the check failed with --features '${features}'"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
  reuse-compliance:
    name: REUSE 3.3 License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install and run REUSE 3.3
        run: |
          pip install --upgrade reuse
          reuse lint
  unit-and-integration-tests:
    name: Tests (${{ matrix.os }} - Rust ${{ matrix.rust }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, msrv]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ matrix.rust == 'msrv' && env.MSRV || matrix.rust }}
          components: clippy
      # rust-toolchain.toml pins the MSRV for every cargo command in the
      # checkout, so the stable rows used to run it as well and stable was
      # never tested. RUSTUP_TOOLCHAIN outranks that file.
      - name: Use the row's toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=${{ matrix.rust == 'msrv' && env.MSRV || matrix.rust }}" >> "$GITHUB_ENV"
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      # nextest runs every test binary in one pool. `cargo test` runs them
      # one at a time, and this suite is ninety-one binaries with a median of
      # five tests each, so most of a run is spent with the runner idle.
      #
      # Pinned: nextest 0.9.129 and later require rustc 1.91, above this
      # crate's MSRV.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-nextest@0.9.128
      # The zsh completion files are parsed by zsh itself, which a Linux
      # runner is not guaranteed to have.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      # The lint job runs on Linux alone, so code behind `cfg(windows)` or a
      # macOS `cfg` was never linted; a Windows-only `cmp_null` went unseen
      # that way. The MSRV rows run the same Clippy as that job.
      - name: Run Clippy
        if: runner.os != 'Linux' && matrix.rust == 'msrv'
        run: cargo clippy --locked --all-targets --features git,inspect-archives -- -D warnings
      - name: Run all tests
        run: cargo nextest run --locked --profile ci --all-targets --features git,inspect-archives
      # nextest does not run doc tests; this covers them.
      - name: Run doc tests
        run: cargo test --locked --doc --features git,inspect-archives
  code-coverage:
    name: Code Coverage (LLVM-Cov)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.MSRV }}
          components: llvm-tools-preview
      - name: Use the MSRV toolchain
        run: echo "RUSTUP_TOOLCHAIN=$MSRV" >> "$GITHUB_ENV"
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: llvm-cov
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: Install cargo-llvm-cov & cargo-nextest
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-llvm-cov,cargo-nextest@0.9.128
      - name: Install zsh
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: Generate Code Coverage Report & Summary
        run: |
          cargo llvm-cov nextest --locked --features git,inspect-archives --workspace --lcov --output-path lcov.info
          bash devtools/coverage.sh summary
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-lcov
          path: lcov.info
      # The floor `just coverage-gate` defaults to. Without one, this job only
      # ran the Linux suite a second time, under instrumentation, as part of
      # the gate. After the upload, so a run below the floor keeps its report.
      - name: Enforce the coverage floor
        run: bash devtools/coverage.sh gate 70
  # Alongside the tests rather than after them. Waiting on the slowest test
  # row put a Windows release build behind a Windows test run, the longest
  # path through a run; `CI result` waits on both either way.
  build-release:
    name: Release Build (${{ matrix.target }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Use stable
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
      # Shared with Release-mode Tests, which restores it on main.
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --features git,inspect-archives
  # The suite against the build users get: the release profile's
  # optimizations and LTO, on the toolchain and target Release Build uses.
  # Every other run of it is a debug build, where undefined behaviour in the
  # unsafe code may never show. It takes minutes no pull request into dev
  # should wait for, so it runs where a release is cut: on main, before the
  # tag, and on a pull request into it.
  release-tests:
    name: Release-mode Tests (${{ matrix.target }})
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Use stable
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
      # Release Build's cache from dev: the same dependencies, built the same
      # way. This job never runs on dev, so it never saves one of its own.
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-nextest@0.9.128
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: Run all tests
        run: cargo nextest run --locked --profile ci --release --target ${{ matrix.target }} --all-targets --features git,inspect-archives
  nix-flake-check:
    name: Nix Flake Validation
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # Sandboxed, because the generated trycmd suites were recorded as the
      # `nixbld` user the sandbox presents. Unsandboxed, a build runs as
      # nixbld1, and dozens of their cases fail on that name alone.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            sandbox = true
            ssl-cert-file = /etc/ssl/certs/ca-certificates.crt
            extra-sandbox-paths = /etc/ssl/certs
            user-agent = lez-ci (https://github.com/fxrdhan/lez)
      - name: Configure curl user-agent for crates.io
        run: |
          echo 'user-agent = "lez-ci (https://github.com/fxrdhan/lez)"' >> ~/.curlrc
          sudo sh -c 'echo "user-agent = \"lez-ci (https://github.com/fxrdhan/lez)\"" >> /etc/curlrc' 2>/dev/null || true
      # Activates once the repo variable CACHIX_CACHE and the secret
      # CACHIX_AUTH_TOKEN are configured; skipped (plain cold build) before
      # that. The action both pulls from and pushes to the cache.
      - name: Restore and push Nix store cache (Cachix)
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Nix Flake Check
        run: nix flake check -L
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIX_SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  # The one check to require before merging. The jobs above are skipped when
  # a pull request does not touch what they test, and a skipped matrix job
  # never reports under its expanded name, so requiring them one by one would
  # leave such a pull request waiting for checks that never come. This job
  # runs unless the whole run is cancelled, and fails if any job it needs
  # failed or was cancelled; a skipped one counts as passed.
  ci-result:
    name: CI result
    needs:
      - changes
      - lint-and-format
      - reuse-compliance
      - unit-and-integration-tests
      - code-coverage
      - build-release
      - release-tests
      - nix-flake-check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the jobs it needs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
