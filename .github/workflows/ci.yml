name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings
  MSRV: "1.90"
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Classify changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
              # The suite asserts on these from disk (man_docs_tests,
              # zsh_completion_classify_tests, theme_schema_tests), so a
              # change to one of them has to run the tests that guard it.
              - 'man/**'
              - 'completions/**'
              - 'docs/**'
              - 'justfile'
              - 'README.md'
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - 'Cargo.lock'
              # The flake builds the crate and runs the trycmd suites under
              # tests/gen and tests/ptests, which no other job runs. Anything
              # that can change what it builds or what those snapshots expect
              # has to trigger it, or a pull request goes green and main goes
              # red on the very next push.
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'man/**'
              - 'completions/**'
              - 'justfile'
              - '.config/**'
              - '.github/workflows/ci.yml'
  lint-and-format:
    name: Lint & Format (Rustfmt & Clippy)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --features git,inspect-archives -- -D warnings
  reuse-compliance:
    name: REUSE 3.3 License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install and run REUSE 3.3
        run: |
          pip install --upgrade reuse
          reuse lint
  unit-and-integration-tests:
    name: Tests (${{ matrix.os }} - Rust ${{ matrix.rust }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, msrv]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust == 'msrv' && env.MSRV || matrix.rust }}
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}
      - name: Run all tests
        run: cargo test --all-targets --features git,inspect-archives
  build-release:
    name: Release Build (${{ matrix.os }})
    needs: [unit-and-integration-tests]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
      - name: Build release binary
        run: cargo build --release --features git,inspect-archives
  nix-flake-check:
    name: Nix Flake Validation
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      # Activates once the repo variable CACHIX_CACHE and the secret
      # CACHIX_AUTH_TOKEN are configured; skipped (plain cold build) before
      # that. The action both pulls from and pushes to the cache.
      - name: Restore and push Nix store cache (Cachix)
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Nix Flake Check
        run: nix flake check -L
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
