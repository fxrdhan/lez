name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings
  MSRV: "1.90"
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Classify changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
              # The suite asserts on these from disk (man_docs_tests,
              # zsh_completion_classify_tests, theme_schema_tests), so a
              # change to one of them has to run the tests that guard it.
              - 'man/**'
              - 'completions/**'
              - 'docs/**'
              - 'justfile'
              - 'README.md'
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - 'Cargo.lock'
              # The flake builds the crate and runs the trycmd suites under
              # tests/gen and tests/ptests, which no other job runs. Anything
              # that can change what it builds or what those snapshots expect
              # has to trigger it, or a pull request goes green and main goes
              # red on the very next push.
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'man/**'
              - 'completions/**'
              - 'justfile'
              - '.config/**'
              - '.github/workflows/ci.yml'
  lint-and-format:
    name: Lint & Format (Rustfmt & Clippy)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --features git,inspect-archives -- -D warnings
  feature-combinations:
    name: Feature Combinations (${{ matrix.label }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: none
            features: ""
          - label: git
            features: git
          - label: inspect-archives
            features: inspect-archives
          - label: git+inspect-archives
            features: git,inspect-archives
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: features-${{ matrix.label }}
      # Library and binary only, deliberately. The integration suite builds
      # its Git and tar fixtures with the optional crates directly, so it
      # cannot compile with those features off -- and `cargo install
      # --no-default-features`, which is what INSTALL.md advertises and what
      # this job exists to protect, does not build the tests either.
      #
      # RUSTFLAGS carries --deny warnings from the workflow env, so an item
      # left behind by a switched-off feature fails here rather than rotting.
      - name: Check
        run: cargo check --no-default-features --features "${{ matrix.features }}"
  reuse-compliance:
    name: REUSE 3.3 License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install and run REUSE 3.3
        run: |
          pip install --upgrade reuse
          reuse lint
  unit-and-integration-tests:
    name: Tests (${{ matrix.os }} - Rust ${{ matrix.rust }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, msrv]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust == 'msrv' && env.MSRV || matrix.rust }}
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}
      # nextest runs every test binary in one pool. `cargo test` runs them
      # one at a time, and this suite is ninety-one binaries with a median of
      # five tests each, so most of a run is spent with the runner idle.
      #
      # Pinned: nextest 0.9.129 and later require rustc 1.91, above this
      # crate's MSRV.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.128
      - name: Run all tests
        run: cargo nextest run --profile ci --all-targets --features git,inspect-archives
      # nextest does not run doc tests; this covers them.
      - name: Run doc tests
        run: cargo test --doc --features git,inspect-archives
  build-release:
    name: Release Build (${{ matrix.os }})
    needs: [unit-and-integration-tests]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
      - name: Build release binary
        run: cargo build --release --features git,inspect-archives
  nix-flake-check:
    name: Nix Flake Validation
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            sandbox = false
            ssl-cert-file = /etc/ssl/certs/ca-certificates.crt
            extra-sandbox-paths = /etc/ssl/certs
            user-agent = lez-ci (https://github.com/fxrdhan/lez)
      - name: Configure curl user-agent for crates.io
        run: |
          echo 'user-agent = "lez-ci (https://github.com/fxrdhan/lez)"' >> ~/.curlrc
          sudo sh -c 'echo "user-agent = \"lez-ci (https://github.com/fxrdhan/lez)\"" >> /etc/curlrc' 2>/dev/null || true
      # Activates once the repo variable CACHIX_CACHE and the secret
      # CACHIX_AUTH_TOKEN are configured; skipped (plain cold build) before
      # that. The action both pulls from and pushes to the cache.
      - name: Restore and push Nix store cache (Cachix)
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Nix Flake Check
        run: nix flake check -L
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIX_SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
