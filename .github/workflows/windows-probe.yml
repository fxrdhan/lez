# A throwaway probe, run by hand from the Actions tab.
#
# Eight upstream reports describe Windows-only behaviour that cannot be
# reproduced on the machine this fork is developed on (see issue #57). Before
# writing a `#[cfg(windows)]` test for any of them, this job runs each
# reproduction on a real Windows runner and prints what happens, so we learn
# which ones still reproduce and which were fixed here without anyone noticing.
#
# Every step prints its own exit code and then resets it, so the job stays
# green whatever the binary does — the log is the result, not the status.
name: Windows Repro Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: Probe the Windows-only upstream reports
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-probe
      - name: Build
        run: cargo build --features git,inspect-archives
      - name: Report the version under test
        run: |
          $exe = Join-Path $PWD 'target\debug\lez.exe'
          "exe = $exe"
          & $exe --version
          $global:LASTEXITCODE = 0
      # eza#337 — `eza.exe t*` raises os error 123. Windows shells do not
      # expand globs, so the binary receives the literal `t*`.
      - name: 'eza#337 — a wildcard argument'
        run: |
          $exe = Join-Path $PWD 'target\debug\lez.exe'
          $d = Join-Path $env:RUNNER_TEMP 'p337'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          'x' | Set-Content (Join-Path $d 'test1.txt')
          'x' | Set-Content (Join-Path $d 'test2.txt')
          'x' | Set-Content (Join-Path $d 'other.txt')
          Set-Location $d
          foreach ($pattern in @('t*', 't*.*', 't?st1.txt')) {
            "--- lez $pattern ---"
            (& $exe $pattern 2>&1 | Out-String).Trim()
            "exit=$LASTEXITCODE"
          }
          $global:LASTEXITCODE = 0
      # eza#404 / eza#874 — a path with a trailing separator raises os error
      # 123. This is what tab completion in PowerShell produces.
      - name: 'eza#404 — a path with a trailing separator'
        run: |
          $exe = Join-Path $PWD 'target\debug\lez.exe'
          foreach ($path in @('C:\Program Files\', 'C:\Program Files', 'C:\Progra~1')) {
            "--- lez '$path' ---"
            (& $exe $path 2>&1 | Select-Object -First 4 | Out-String).Trim()
            "exit=$LASTEXITCODE"
          }
          $global:LASTEXITCODE = 0
      # eza#853 — a relative symlink pointing up and back down is listed as a
      # broken link, and its contents never appear.
      - name: 'eza#853 — a relative directory symlink'
        run: |
          $exe = Join-Path $PWD 'target\debug\lez.exe'
          $d = Join-Path $env:RUNNER_TEMP 'p853'
          New-Item -ItemType Directory -Force -Path (Join-Path $d 'dir') | Out-Null
          'x' | Set-Content (Join-Path $d 'dir\test-file')
          Set-Location (Join-Path $d 'dir')
          cmd /c 'mklink /d test ..\dir'
          "mklink exit=$LASTEXITCODE"
          if (Test-Path 'test') {
            Set-Location 'test'
            '--- lez -la inside the link ---'
            (& $exe -la 2>&1 | Out-String).Trim()
            "exit=$LASTEXITCODE"
          } else {
            'SKIPPED: the runner could not create a directory symlink'
          }
          $global:LASTEXITCODE = 0
      # eza#1025 — listing from inside a `mklink /D` symlink shows the wrong
      # children.
      - name: 'eza#1025 — listing from inside a directory symlink'
        run: |
          $exe = Join-Path $PWD 'target\debug\lez.exe'
          $d = Join-Path $env:RUNNER_TEMP 'p1025'
          New-Item -ItemType Directory -Force -Path (Join-Path $d 'test1') | Out-Null
          'test' | Set-Content (Join-Path $d 'test1\temp.txt')
          Set-Location $d
          cmd /c 'mklink /d test2 test1'
          "mklink exit=$LASTEXITCODE"
          if (Test-Path 'test2') {
            Set-Location 'test2'
            '--- dir ---'
            (cmd /c dir /b | Out-String).Trim()
            '--- lez -l ---'
            (& $exe -l 2>&1 | Out-String).Trim()
            "exit=$LASTEXITCODE"
          } else {
            'SKIPPED: the runner could not create a directory symlink'
          }
          $global:LASTEXITCODE = 0
      # eza#1104 — listing the named pipe filesystem floods the output with one
      # "Access is denied" line per pipe.
      - name: 'eza#1104 — the named pipe filesystem'
        run: |
          $exe = Join-Path $PWD 'target\debug\lez.exe'
          $out = & $exe '\\.\pipe\' 2>&1 | Out-String
          "exit=$LASTEXITCODE"
          $lines = $out -split "`n"
          "total lines: $($lines.Count)"
          "lines mentioning a denial: $(($lines | Where-Object { $_ -match 'denied|error' }).Count)"
          '--- first 12 lines ---'
          ($lines | Select-Object -First 12 | Out-String).Trim()
          $global:LASTEXITCODE = 0
      # eza#1220 — a leading underscore is treated as the Windows equivalent of
      # a dotfile, so Python dunder files vanish from a plain listing.
      - name: 'eza#1220 — files beginning with an underscore'
        run: |
          $exe = Join-Path $PWD 'target\debug\lez.exe'
          $d = Join-Path $env:RUNNER_TEMP 'p1220'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          foreach ($f in @('__init__.py', '__main__.py', '_private.py', 'normal.py')) {
            'x' | Set-Content (Join-Path $d $f)
          }
          Set-Location $d
          '--- lez (no -a) ---'
          (& $exe --color=never 2>&1 | Out-String).Trim()
          '--- lez -a ---'
          (& $exe -a --color=never 2>&1 | Out-String).Trim()
          $global:LASTEXITCODE = 0
      # eza#1665 — --ignore-glob has no effect once -a is also given.
      - name: 'eza#1665 — --ignore-glob together with -a'
        run: |
          $exe = Join-Path $PWD 'target\debug\lez.exe'
          $d = Join-Path $env:RUNNER_TEMP 'p1665'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          foreach ($f in @('keep.txt', 'skip.log', 'also-skip.log')) {
            'x' | Set-Content (Join-Path $d $f)
          }
          Set-Location $d
          '--- lez --ignore-glob=*.log ---'
          (& $exe --color=never "--ignore-glob=*.log" 2>&1 | Out-String).Trim()
          '--- lez -a --ignore-glob=*.log  (the .log files must not appear) ---'
          (& $exe -a --color=never "--ignore-glob=*.log" 2>&1 | Out-String).Trim()
          $global:LASTEXITCODE = 0
      # eza#1769 — -g and -a together collapse the listing to one column.
      - name: 'eza#1769 — -g together with -a'
        run: |
          $exe = Join-Path $PWD 'target\debug\lez.exe'
          $d = Join-Path $env:RUNNER_TEMP 'p1769'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          foreach ($n in 1..12) { 'x' | Set-Content (Join-Path $d "file$n") }
          Set-Location $d
          # Not $args: PowerShell reserves that name for a function's own
          # arguments, and assigning to it at script scope is asking for trouble.
          foreach ($flags in @(@('-w', '100'), @('-a', '-w', '100'), @('-g', '-w', '100'), @('-g', '-a', '-w', '100'))) {
            "--- lez $($flags -join ' ') ---"
            $out = & $exe --color=never @flags 2>&1 | Out-String
            "rows: $(($out.Trim() -split "`n").Count)"
            $out.Trim()
          }
          $global:LASTEXITCODE = 0
