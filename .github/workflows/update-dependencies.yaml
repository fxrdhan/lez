name: "Automated Dependency Bump"
# Updates Cargo.lock and flake.lock every Thursday, in one pull request.
#
# GitHub holds every workflow run on a pull request that GITHUB_TOKEN opens or
# updates until someone with write access approves it, and no setting turns
# that off. So the branch is pushed and the pull request opened with
# DEPENDENCY_BUMP_TOKEN when that secret is set: a fine-grained personal access
# token for this repository alone, with Contents and Pull requests read and
# write. The pull request then starts CI on its own, and gets the `CI result`
# check the dev ruleset requires. Without the secret, GITHUB_TOKEN opens it,
# and its runs wait for "Approve workflows to run" in the merge box.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 4'
# For GITHUB_TOKEN, read-only by default, to push the branch and open the pull
# request when DEPENDENCY_BUMP_TOKEN is not set.
permissions:
  contents: write
  pull-requests: write
jobs:
  update-and-create-pr:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # The token checkout keeps is the one `git push` uses below.
      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPENDENCY_BUMP_TOKEN || github.token }}
      - name: "Install Nix"
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: "Set up Git credentials"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: "Run update script"
        id: run_script
        run: |
          chmod +x .github/workflows/update-dependencies.sh
          .github/workflows/update-dependencies.sh

          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          echo "branch=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
      - name: "Push branch and create Pull Request"
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.run_script.outputs.branch }}
        run: |
          if [ "$(git rev-list --count origin/dev..HEAD)" -eq 0 ]; then
            echo "No dependency updates. Nothing to open."
            exit 0
          fi

          # A rerun on the same day rebuilds the branch from scratch.
          git push --force-with-lease -u origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "build(deps): Automatic dependency updates for $(date --iso-8601)" \
              --body "This PR was automatically generated by a GitHub Action to update crate and flake dependencies. Please review the changes and merge." \
              --base dev \
              --head "$BRANCH"
          fi
