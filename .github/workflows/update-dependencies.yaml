name: "Automated Dependency Bump"
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 4'
# The default token is read-only, which cannot push the update branch, open
# the pull request or start CI on it.
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  update-and-create-pr:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "Install Nix"
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: "Set up Git credentials"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: "Run update script"
        id: run_script
        run: |
          chmod +x .github/workflows/update-dependencies.sh
          .github/workflows/update-dependencies.sh

          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          echo "branch=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
      - name: "Push branch and create Pull Request"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.run_script.outputs.branch }}
        run: |
          if [ "$(git rev-list --count origin/dev..HEAD)" -eq 0 ]; then
            echo "No dependency updates. Nothing to open."
            exit 0
          fi

          # A rerun on the same day rebuilds the branch from scratch.
          git push --force-with-lease -u origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "build(deps): Automatic dependency updates for $(date --iso-8601)" \
              --body "This PR was automatically generated by a GitHub Action to update crate and flake dependencies. Please review the changes and merge." \
              --base dev \
              --head "$BRANCH"
          fi

          # Events caused by GITHUB_TOKEN do not start other workflows, so the
          # pull request above gets no CI run of its own. workflow_dispatch is
          # the exception.
          gh workflow run ci.yml --ref "$BRANCH"
