#
# The workflows' actions alone. The Automated Dependency Bump workflow
# updates Cargo.lock and flake.lock every Thursday in one pull request,
# which per-crate pull requests from Dependabot would only race.
#
# This repository is a fork, and GitHub ignores this file on a fork until
# Dependabot version updates are enabled under Settings > Advanced Security.
# Options: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "github-actions"
    # Workflow files stored in the
    # default location of `.github/workflows`
    directory: "/"
    schedule:
      interval: "weekly"
