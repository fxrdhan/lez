dump_dir: tests/ptests
depth: 1
binary: lez
gen_binary: target/debug/lez
args: tests/test_dir
commands:
  ? - null # Meta options
    - --help
  :
  ? - -v
    - --version
  :
  ? - -1 # Display Options
    - --oneline
  :
  ? - -l
    - --long
  :
  ? - -G
    - --grid
  :
  ? - -x
    - --across
  :
  ? - -R
    - --recurse
  :
  ? - -T
    - --tree
  :
  ? - -X
    - --dereference
  :
  ? - -F=auto
    - --classify=auto
  :
  ? - -F=always
    - --classify=always
  :
  ? - -F=never
    - --classify=never
  :
  ? - null
    - --color=auto
  :
  ? - null
    - --color=always
  :
  ? - null
    - --color=never
  :
  ? - null
    - --icons=auto
  :
  ? - null
    - --icons=always
  :
  ? - null
    - --icons=never
  :
  ? - null
    - --no-quotes
  :
  ? - null
    - --hyperlink=auto
  :
  ? - null
    - --hyperlink=always
  :
  ? - null
    - --hyperlink=never
  :
  ? - null
    - --absolute=on
  :
  ? - null
    - --absolute=follow
  :
  ? - null
    - --absolute=off
  :
  ? - -w
    - --width
  : values:
      - 15
      - 30
      - 200
  ? - null
    - --smart-group
  :
  ? - -a # Filtering and Sorting Options
    - --all
  :
  ? - -A
    - --almost-all
  :
  ? - -d
    - --treat-dirs-as-files
  :
  ? - -L # Hidden alias
    - --level
  : prefix: -T
    values:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
  ? - -r
    - --reverse
  :
  ? - -s
    - --sort
  : short: -s
    long: time-style
    prefix: -l
    values: # non-deterministic results with our setup (tests/test_dir) are commented out 
      # - accessed
      # - age
      # - changed
      # - created
      # - date
      - Ext
      - ext
      - Extension
      - extension
      - Filename
      - filename
      # - inode
      # - modified
      - Name
      - name
      # - newest
      # - none
      # - oldest
      # - size
      # - time
      - type
  ? - null
    - --group-directories-first
  :
  ? - null
    - --group-directories-last
  :
  ? - -D
    - --only-dirs
  :
  ? - -f
    - --only-files
  :
  ? - -I # TODO: add more globs
    - --ignore-glob
  : prefix: -l
    values:
      - "*.toml"
  ? - null
    - --git-ignore
  :
  ? - -b # Long View Options
    - --binary
  : prefix: -l
  ? - -B
    - --bytes
  : prefix: -l
  ? - -g
    - --group
  : prefix: -l
  ? - -h
    - --header
  : prefix: -l
  ? - -H
    - --links
  : prefix: -l
  ? - -i
    - --inode
  : prefix: -l
  # --loc and --code take their mode via `=` only. Their bare forms belong
  # here, but tests/ptests has no snapshot for either, and the snapshots come
  # from `nix build ./#trydump`, which needs the generated fixture. Add the
  # entries back together with the dump they need.
  ? - -m
    - --modified
  : prefix: -l
  ? - -M
    - --mounts
  : prefix: -l
  ? - -n
    - --numeric
  : prefix: -l
  ? - -S
    - --blocksize
  : prefix: -l
  ? - null
    - --blocks
  : prefix: -l
  ? - -t
    - --time
  : prefix: -l
    values:
      - modified
      #- accessed BROKEN
      #- changed
      #- created
  ? - -u
    - --accessed
  : prefix: -l
  ? - -U
    - --created
  : prefix: -l
  ? - null
    - --changed
  : prefix: -l
  ? - null
    - --time-style
  : long: time-style
    prefix: -l
    values:
      - default
      - iso
      - long-iso
      - full-iso
      - relative
  ? - null
    - --total-size
  : prefix: -l
  ? - null
    - --no-permissions
  : prefix: -l
  ? - -o
    - --octal-permissions
  : prefix: -l
  ? - null
    - --no-filesize
  : prefix: -l
  ? - null
    - --no-user
  : prefix: -l
  ? - null
    - --no-language
  : prefix: -l
  ? - null
    - --git
  : prefix: -l
  ? - null
    - --no-git
  : prefix: -l
  ? - null
    - --git-repos
  : prefix: -l
  ? - -@
    - --extended
  : prefix: -l
  ? - -Z
    - --context
  : prefix: -l
