# yaml-language-server: $schema=https://raw.githubusercontent.com/fxrdhan/lez/main/docs/theme-schema.json
filekinds:
  normal:
    foreground: Blue
  directory:
    foreground: Blue
  symlink:
    foreground: Cyan
  # Colour for Btrfs subvolume directories (Linux)
  btrfs_subvol:
    foreground: Blue
    underline: true
  executable:
    foreground: Green
perms:
  user_read:
    foreground: Yellow
    is_bold: true
  user_write:
    foreground: Red
    is_bold: true
  user_execute_file:
    foreground: Green
    is_bold: true
  user_execute_other:
    foreground: Green
    is_bold: true
  group_read:
    foreground: Yellow
  group_write:
    foreground: Red
  group_execute:
    foreground: Green
  other_read:
    foreground: Yellow
  other_write:
    foreground: Red
  other_execute:
    foreground: Green
filenames:
  # Just change the icon glyph
  Cargo.toml: {icon: {glyph: 🦀}}
  Cargo.lock: {icon: {glyph: 🦀}}
extensions:
  # Change the filename color and icon
  # NOTE: not all unicode glyphs support color changes
  rs: {filename: {foreground: Red}, icon: {glyph: 🦀}}
  # Change the icon glyph and color
  nix: {icon: {glyph: ❄, style: {foreground: White}}}
  # Default fallback icon overrides for unmapped files and directories
  .default_file: {icon: {glyph: 📄}}
  .default_file_unknown: {icon: {glyph: ❓}}
  .default_directory: {icon: {glyph: 📁}}
  .default_directory_empty: {icon: {glyph: 📂}}
