[package]
name = "lez"
description = "A modern, fast, and feature-rich replacement for ls written in Rust"
authors = [
  "fxrdhan <https://github.com/fxrdhan>",
  "Christina Sørensen <christina@cafkafk.com>",
]
categories = ["command-line-utilities"]
edition = "2024"
rust-version = "1.90"
exclude = [
  "/docs/",
  "/devtools/",
  "/snap/",
  "/tests/",
  "/.config/",
  "/.github/",
  "/deb.asc",
  "/deny.toml",
  "/flake.*",
  "/justfile",
  "/powertest.yaml",
  "/rust-toolchain.toml",
  "/.envrc",
  "/.gitignore",
  "/.git-blame-ignore-revs",
  "/.pre-commit-config-non-nix.yaml",
]
readme = "README.md"
homepage = "https://github.com/fxrdhan/lez"
license = "EUPL-1.2"
repository = "https://github.com/fxrdhan/lez"
version = "0.25.0"


[package.metadata.deb]
license-file = ["LICENSE.txt", "4"]
depends = "$auto"
extended-description = """
lez is a modern, maintained replacement for ls
"""
section = "utils"
priority = "optional"
assets = [
  [
    "target/release/lez",
    "/usr/bin/lez",
    "0755",
  ],
  [
    "target/release/../man/lez.1",
    "/usr/share/man/man1/lez.1",
    "0644",
  ],
  [
    "target/release/../man/lez_colors.5",
    "/usr/share/man/man5/lez_colors.5",
    "0644",
  ],
  [
    "target/release/../man/lez_colors-explanation.5",
    "/usr/share/man/man5/lez_colors-explanation.5",
    "0644",
  ],
  [
    "completions/bash/lez",
    "/usr/share/bash-completion/completions/lez",
    "0644",
  ],
  [
    "completions/zsh/_lez",
    "/usr/share/zsh/site-functions/_lez",
    "0644",
  ],
  [
    "completions/fish/lez.fish",
    "/usr/share/fish/vendor_completions.d/lez.fish",
    "0644",
  ],
]


[[bin]]
name = "lez"


[dependencies]
rayon = "1.10.0"
chrono = { version = "0.4.40", default-features = false, features = ["clock"] }
humantime = "2.3"
nu-ansi-term = { version = "0.50.1", features = [
  "serde",
  "derive_serde_style",
] }
glob = "0.3"
libc = "0.2"
locale = "0.2"
log = "0.4"
natord-plus-plus = "2.0"
path-clean = "1.0.1"
unit-prefix = "0.5.2"
# palette 0.7.6 is broken: https://github.com/eza-community/eza/pull/1207
palette = { version = "=0.7.5", default-features = false, features = ["std"] }
# palette 0.7.5 requires palette_derive via a caret requirement ("0.7.5"), so
# pinning palette alone still lets palette_derive 0.7.6+ resolve, which is what
# actually pulls in by_address. The derive crate must be pinned directly.
palette_derive = "=0.7.5"
percent-encoding = "2.3.1"
phf = { version = "0.13.1", features = ["macros"] }
plist = { version = "1.7.0", default-features = false }
uutils_term_grid = "0.8.0"
terminal_size = "0.4.2"
timeago = { version = "0.6.0", default-features = false }
unicode-width = "0.2"
ansi-width = "0.1.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0.0"
same-file = "1.0.6"
serde_norway = "0.9"
backtrace = "0.3"
clap = { version = "4.5.38", features = ["cargo", "derive", "wrap_help"] }
icu_collator = "1.5"
icu_locid = "1.5"
icu_provider = { version = "1.5", features = ["sync"] }
sys-locale = "0.3"
tree_magic_mini = { version = "3.2.0", features = ["with-gpl-data"] }
tar = { version = "0.4", optional = true }

[dependencies.git2]
version = "0.21"
optional = true
default-features = false

[target.'cfg(target_os = "linux")'.dependencies]
proc-mounts = "0.3"
capctl = "0.2.4"

[target.'cfg(unix)'.dependencies]
uzers = "0.12.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_System_Console",
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[build-dependencies]
chrono = { version = "0.4.40", default-features = false, features = ["clock"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
trycmd = "1.0"

[features]
default = ["git", "inspect-archives"]
git = ["git2"]
inspect-archives = ["dep:tar"]
vendored-openssl = ["git2/vendored-openssl"]
vendored-libgit2 = ["git2/vendored-libgit2"]
# Should only be used inside of flake.nix
nix = []
# Should only be used inside of flake.nix locally (not on CI)
nix-local = []
# Should only be used inside of flake.nix
# Shouldn't ever be used in CI (slow!)
powertest = []
nix-generated = []

# use LTO for smaller binaries (that take longer to build)
[profile.release]
lto = true
strip = true
opt-level = 3
codegen-units = 1
panic = 'abort'

[[bench]]
name = "my_benchmark"
harness = false
