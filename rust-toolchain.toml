[toolchain]
# The MSRV. Update it together with `rust-version` in Cargo.toml and `MSRV`
# in .github/workflows/ci.yml, whose stable rows override this pin.
# At the time of writing, 1.90 is the latest version supported by OpenBSD
channel = "1.90"
components = [
  "rustfmt",
  "rustc",
  "rust-src",
  "rust-analyzer",
  "cargo",
  "clippy",
  "llvm-tools-preview",
]
profile = "minimal"
